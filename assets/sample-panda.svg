<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img" aria-label="像素风熊猫示例图">
  <rect width="64" height="64" fill="#FFF3E0"/>
  <!-- 背景留白装饰点 -->
  <rect x="5" y="8" width="2" height="2" fill="#F3E7D8"/>
  <rect x="57" y="6" width="2" height="2" fill="#F3E7D8"/>
  <rect x="8" y="52" width="2" height="2" fill="#F3E7D8"/>
  <rect x="54" y="54" width="2" height="2" fill="#F3E7D8"/>
  <!-- 双耳 -->
  <rect x="14" y="8" width="10" height="8" fill="#2B2B2B"/>
  <rect x="40" y="8" width="10" height="8" fill="#2B2B2B"/>
  <!-- 头部 -->
  <rect x="16" y="12" width="32" height="8" fill="#FFFFFF"/>
  <rect x="12" y="20" width="40" height="12" fill="#FFFFFF"/>
  <rect x="12" y="32" width="40" height="10" fill="#FFFFFF"/>
  <rect x="16" y="42" width="32" height="8" fill="#FFFFFF"/>
  <rect x="22" y="50" width="20" height="6" fill="#FFFFFF"/>
  <!-- 眼眶 -->
  <rect x="18" y="20" width="12" height="12" fill="#2B2B2B"/>
  <rect x="34" y="20" width="12" height="12" fill="#2B2B2B"/>
  <!-- 眼睛 -->
  <rect x="22" y="24" width="4" height="4" fill="#FFFFFF"/>
  <rect x="38" y="24" width="4" height="4" fill="#FFFFFF"/>
  <rect x="24" y="26" width="2" height="2" fill="#2B2B2B"/>
  <rect x="40" y="26" width="2" height="2" fill="#2B2B2B"/>
  <!-- 鼻子 -->
  <rect x="28" y="34" width="8" height="4" fill="#2B2B2B"/>
  <!-- 腮红 -->
  <rect x="14" y="30" width="4" height="2" fill="#FFC9C9"/>
  <rect x="46" y="30" width="4" height="2" fill="#FFC9C9"/>
  <!-- 嘴 -->
  <rect x="30" y="38" width="4" height="2" fill="#C9B8A5"/>
</svg>
